<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="./output.css" rel="stylesheet">
</head>


<body class="font-hanken-grotesk">

<!--Start of Header section-->  
<header class="bg-background-fill py-2"> 
    <div class="container mx-auto flex justify-between items-center ">

    <div class="menu hidden max-[480px]:block">
        <a href="#">
            <i class="fa-solid fa-bars" style="color: rgb(51, 69, 13);"></i>
        </a>
    </div>   

    <div class="logo max-[480px]:mx-auto">
        <img src="./assests/header/Blé Logo.svg"> 
    </div>

    <div class="list">
        <ul class="flex gap-10 text-primary-green max-[620px]:gap-4 max-[620px]:text-sm max-[480px]:hidden">
            <li>
                <a href="#">HOME</a>
            </li>
            <li>
                <a href="#">FRESH BREAD</a>
            </li>
            <li>
                <a href="#">PASTRIES</a>
            </li>
            <li>
                <a href="#">COOKIES</a>
            </li>
            <li>
                <a href="#">CAKES</a>
            </li>
        </ul>
    </div>


    <div class="icons">
        <ul class="flex gap-6">
            <li>
                <a href="#">
                     <i class="fa-solid fa-cart-shopping" style="color: rgb(51, 69, 13);"></i> 
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-user" style="color: rgb(51, 69, 13);"></i>
                 </a>
            </li>
        </ul>
    </div>
  </div>
</header>
<!--End of Header section-->

<!--Start of Hero section-->
<main>
    <section class="Hero_Section relative flex justify-center items-center">
        <img src="./assests/Hero Section.png" class="w-full"> 
        <div class="absolute inset-0 bg-hero-filling/40"></div> 
        <h1 class="hero_heading">
             Fresh From The Oven. Straight To Your Heart.
        </h1>
    </section>
<!--End of Hero section-->    

<!--Start of Our Favorite header section-->
    <section class="Our_Favorites_header pt-30 pb-16">
        <div class="container row">
            <div class="fav_heading">
                <h2>Our Favorites</h2>
            </div>

            <a href="#" class="ml-auto">
                <img src="./assests/Our_Fav/view_all.svg">
            </a>
        </div>
    </section>
<!--End of Our Favorite header section-->    

<!--Start of Our Favorite (cards) section-->
    <section class="Our_Favorites">
        <div class="container row">
            <div class="favorites flex gap-6 px-16">

              <div class="favorite pb-6">
                <img src="./assests/Our_Fav/Croissants.webp" >
                <div class="fav_name flex p-6">
                    <h3>Butter Croissant</h3>
                
                <div class="price">
                    <p>$3.00</p>
                    </div>
                </div>

                <div class="add_to_cart">
                    <button type="button">ADD TO CART</button>
                </div>
              </div>


              <div class="favorite pb-6">
                <img src="./assests/Our_Fav/Macarons.webp" >
                <div class="fav_name flex p-6">
                    <h3>Macarons</h3>
                
                <div class="price">
                    <p>$15.00</p>
                    </div>
                </div>
              
                <div class="add_to_cart">
                    <button type="button">ADD TO CART</button>
                </div>
              </div>

              <div class="favorite pb-6">
                <img src="./assests/Our_Fav/bread.png" >
                <div class="fav_name flex p-6">
                    <h3>Baguette</h3>
                
                <div class="price">
                    <p>$5.00</p>
                    </div>
                </div>

                <div class="add_to_cart">
                    <button type="button">ADD TO CART</button>
                </div>
              </div>

              <div class="favorite pb-6">
                <img src="./assests/Our_Fav/cakes.webp" >
                <div class="fav_name flex p-6">
                    <h3>Chocolate Tart</h3>
                
                <div class="price">
                    <p>$10.00</p>
                    </div>
                </div>

                <div class="add_to_cart">
                    <button type="button">ADD TO CART</button>
                </div>
              </div>
        </div>
        </div>
    </section>
<!--End of Our Favorite (cards) section-->    


</main>











</body>
</html>
